name: Build APK
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Optional override. Leave blank to use APP_VERSION from src/routes/about.tsx.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Single source of truth. The version a user reads in the About tab is the
      # version stamped on the APK. src/routes/about.tsx owns it, nothing else.
      - name: Resolve version from the app
        env:
          OVERRIDE: ${{ inputs.versionName }}
        run: |
          APP_VERSION="$OVERRIDE"
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION=$(sed -n 's/^const APP_VERSION = "\(.*\)";$/\1/p' src/routes/about.tsx)
          fi
          if ! printf '%s' "$APP_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Could not resolve a valid version. Got '$APP_VERSION'. Check APP_VERSION in src/routes/about.tsx."
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Building GeoField $APP_VERSION (versionCode ${{ github.run_number }})"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        # Fall back to a non-frozen install if the lockfile lags package.json,
        # rather than failing the whole APK build on a lockfile mismatch.
        run: bun install --frozen-lockfile || bun install

      - name: Build web assets (SPA mode, no nitro)
        env:
          CAPACITOR_BUILD: '1'
        run: bun run build

      - name: Create static entry point
        run: |
          test -f dist/client/_shell.html || { echo "prerendered shell missing"; exit 1; }
          cp dist/client/_shell.html dist/client/index.html
          ls -la dist/client/
          du -sh dist/client

      - name: Generate Android project
        run: ./node_modules/.bin/cap add android

      - name: Sync web assets into Android project
        run: ./node_modules/.bin/cap sync android

      # The web app's LOCATE flow calls a native "EnableLocation" plugin that
      # shows Google Play Services' one-tap "turn on location" dialog over the
      # app (SettingsClient + ResolvableApiException). Capacitor has no such
      # API, and android/ is regenerated every build, so the plugin is
      # injected here.
      - name: Inject EnableLocation native plugin
        run: |
          python3 - <<'PY'
          import pathlib, sys

          pkg_dir = pathlib.Path("android/app/src/main/java/com/eondesigns/geofield")
          if not pkg_dir.is_dir():
              sys.exit(f"::error::{pkg_dir} not found; has the package name changed?")

          plugin = pkg_dir / "EnableLocationPlugin.java"
          plugin.write_text('''package com.eondesigns.geofield;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.google.android.gms.common.api.ResolvableApiException;
          import com.google.android.gms.location.LocationRequest;
          import com.google.android.gms.location.LocationServices;
          import com.google.android.gms.location.LocationSettingsRequest;
          import com.google.android.gms.location.Priority;
          import com.google.android.gms.location.SettingsClient;

          @CapacitorPlugin(name = "EnableLocation")
          public class EnableLocationPlugin extends Plugin {

            @PluginMethod
            public void request(PluginCall call) {
              try {
                LocationRequest lr = new LocationRequest.Builder(Priority.PRIORITY_HIGH_ACCURACY, 10000).build();
                LocationSettingsRequest req = new LocationSettingsRequest.Builder()
                    .addLocationRequest(lr)
                    .setAlwaysShow(true)
                    .build();
                SettingsClient client = LocationServices.getSettingsClient(getActivity());
                client.checkLocationSettings(req)
                    .addOnSuccessListener(r -> {
                      JSObject o = new JSObject();
                      o.put("status", "enabled");
                      call.resolve(o);
                    })
                    .addOnFailureListener(e -> {
                      if (e instanceof ResolvableApiException) {
                        try {
                          ((ResolvableApiException) e).startResolutionForResult(getActivity(), 42001);
                          JSObject o = new JSObject();
                          o.put("status", "prompted");
                          call.resolve(o);
                        } catch (Exception ex) {
                          JSObject o = new JSObject();
                          o.put("status", "unavailable");
                          call.resolve(o);
                        }
                      } else {
                        JSObject o = new JSObject();
                        o.put("status", "unavailable");
                        call.resolve(o);
                      }
                    });
              } catch (Exception e) {
                JSObject o = new JSObject();
                o.put("status", "unavailable");
                call.resolve(o);
              }
            }
          }
          '''.replace("\n          ", "\n"))

          main = pkg_dir / "MainActivity.java"
          src = main.read_text()
          marker = "public class MainActivity extends BridgeActivity {}"
          if marker not in src:
              sys.exit("::error::MainActivity.java does not match the expected Capacitor template; refusing to patch blind.")
          src = src.replace(
              "import com.getcapacitor.BridgeActivity;",
              "import android.os.Bundle;\nimport com.getcapacitor.BridgeActivity;",
          )
          src = src.replace(
              marker,
              "public class MainActivity extends BridgeActivity {\n"
              "    @Override\n"
              "    public void onCreate(Bundle savedInstanceState) {\n"
              "        registerPlugin(EnableLocationPlugin.class);\n"
              "        super.onCreate(savedInstanceState);\n"
              "    }\n"
              "}",
          )
          main.write_text(src)

          gradle = pathlib.Path("android/app/build.gradle")
          g = gradle.read_text()
          dep = 'implementation "com.google.android.gms:play-services-location:21.3.0"'
          if dep not in g:
              g = g.replace("dependencies {", "dependencies {\n    " + dep, 1)
              gradle.write_text(g)

          print("EnableLocation plugin injected, MainActivity patched, play-services-location added.")
          PY



      # @capacitor/assets insets the foreground 16.7% on every side. Source art
      # must therefore be tight to the glyph, or the padding compounds and the
      # pin shrinks. Generated here from logo.ts so the mark has exactly one
      # source of truth and no PNG has to be committed.
      - name: Render icon sources from the GeoField mark
        run: |
          # Ubuntu 24.04 runners mark system Python externally-managed (PEP 668).
          python3 -m pip install --quiet --disable-pip-version-check --break-system-packages pillow \
            || python3 -m pip install --quiet --disable-pip-version-check pillow \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil; }
          python3 -c "import PIL; print('pillow', PIL.__version__)"
          mkdir -p assets
          python3 - <<'PY'
          import base64, io, pathlib, re
          from PIL import Image

          src = pathlib.Path("src/lib/logo.ts").read_text()
          m = re.search(r"data:image/png;base64,([A-Za-z0-9+/=]+)", src)
          if not m:
              raise SystemExit("GEOFIELD_MARK base64 not found in src/lib/logo.ts")
          mark = Image.open(io.BytesIO(base64.b64decode(m.group(1)))).convert("RGBA")

          CANVAS = 1024
          OBSIDIAN = (0x12, 0x14, 0x17, 255)

          def canvas_with_mark(height_fraction, background):
              h = round(CANVAS * height_fraction)
              w = round(h * mark.width / mark.height)
              glyph = mark.resize((w, h), Image.LANCZOS)
              out = Image.new("RGBA", (CANVAS, CANVAS), background)
              out.alpha_composite(glyph, ((CANVAS - w) // 2, (CANVAS - h) // 2))
              return out

          # Adaptive foreground. 84% survives the 16.7% inset and the circular mask.
          canvas_with_mark(0.84, (0, 0, 0, 0)).save("assets/icon-foreground.png")
          # Adaptive background. Flat obsidian.
          Image.new("RGBA", (CANVAS, CANVAS), OBSIDIAN).save("assets/icon-background.png")
          # Legacy square icon. No inset is applied to this one, so it needs its
          # own margin for launchers that mask it into a circle.
          canvas_with_mark(0.62, OBSIDIAN).save("assets/icon.png")

          for name in ("icon-foreground.png", "icon-background.png", "icon.png"):
              im = Image.open("assets/" + name)
              print(f"{name:24} {im.size[0]}x{im.size[1]} {im.mode}")
          PY

      - name: Generate app icons and splash from the GeoField mark
        run: |
          ./node_modules/.bin/capacitor-assets generate --android \
            --iconBackgroundColor '#121417' \
            --iconBackgroundColorDark '#121417' \
            --splashBackgroundColor '#121417' \
            --splashBackgroundColorDark '#121417'
          find android/app/src/main/res -name "ic_launcher*" | head -20

      - name: Add required permissions to AndroidManifest
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          x = p.read_text()
          perms = [
            "android.permission.ACCESS_FINE_LOCATION",
            "android.permission.ACCESS_COARSE_LOCATION",
            "android.permission.RECORD_AUDIO",
            "android.permission.INTERNET",
          ]
          add = "".join(
            f'    <uses-permission android:name="{n}" />\n'
            for n in perms if n not in x
          )
          if add:
            x = x.replace("</manifest>", add + "</manifest>")
            p.write_text(x)
          print(x)
          PY

      - name: Paint the system bars with the obsidian shell colour
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          p = pathlib.Path("android/app/src/main/res/values/styles.xml")
          x = p.read_text()
          m = re.search(r'<style name="AppTheme\.NoActionBar"[^>]*>', x)
          if not m:
              sys.exit("AppTheme.NoActionBar not found in styles.xml")
          if "android:windowBackground" not in x:
              items = (
                  '\n        <item name="android:windowBackground">#FF121417</item>'
                  '\n        <item name="android:statusBarColor">#FF121417</item>'
                  '\n        <item name="android:navigationBarColor">#FF121417</item>'
                  '\n        <item name="android:windowLightStatusBar">false</item>'
                  '\n        <item name="android:windowLightNavigationBar">false</item>'
              )
              x = x[:m.end()] + items + x[m.end():]
              p.write_text(x)
          print(x)
          PY

      - name: Set versionCode and versionName
        env:
          VN: ${{ env.APP_VERSION }}
          VC: ${{ github.run_number }}
        run: |
          f=android/app/build.gradle
          sed -i "s/versionCode .*/versionCode $VC/" "$f"
          sed -i "s/versionName \".*\"/versionName \"$VN\"/" "$f"
          grep -E "versionCode|versionName|applicationId" "$f"

      - name: Restore keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/geofield.keystore"
          ls -l "$RUNNER_TEMP/geofield.keystore"

      - name: Build signed release APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/geofield.keystore" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KS_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Verify the APK is signed by our key
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK: $APK"
          ls -lh "$APK"
          SIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
          "$SIGNER" verify --print-certs "$APK"
          cp "$APK" "GeoField-${{ env.APP_VERSION }}.apk"

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/geofield.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: GeoField-apk
          path: GeoField-*.apk
          retention-days: 7
