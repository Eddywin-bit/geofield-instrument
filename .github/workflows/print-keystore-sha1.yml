name: Print keystore SHA-1 (temporary, one-off lookup)
on:
  workflow_dispatch: {}

# Read-only, no release: only decodes the signing keystore inside this
# ephemeral runner to print its SHA-1 fingerprint (needed to register an
# Android OAuth client for cloud backup), then deletes it. Never writes the
# keystore or any password to a committed file or artifact.
permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Decode keystore, print SHA-1 only, clean up
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +x
          KS_PATH="$RUNNER_TEMP/geofield.keystore"
          echo "$KS_B64" | base64 -d > "$KS_PATH"
          LINE=$(keytool -list -v -keystore "$KS_PATH" -alias "$KS_ALIAS" \
            -storepass "$KS_PASS" -keypass "$KEY_PASS" 2>/dev/null | grep "SHA1:")
          rm -f "$KS_PATH"
          echo "ANDROID_OAUTH_SHA1_FINGERPRINT ::: $LINE"

      - name: Clean up keystore (always, in case the step above failed midway)
        if: always()
        run: rm -f "$RUNNER_TEMP/geofield.keystore"
