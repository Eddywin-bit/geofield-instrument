name: Build APK
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Optional override. Leave blank to use APP_VERSION from src/lib/app-version.ts.'
        required: false
        default: ''
      test_build:
        description: 'Test build: publish only to geofield-test.apk on Pages. Does NOT touch the public geofield.apk, version.json, or the GitHub Release (students stay on the current version).'
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Single source of truth. The version a user reads in the About tab is the
      # version stamped on the APK. src/lib/app-version.ts owns it, nothing else.
      - name: Resolve version from the app
        env:
          OVERRIDE: ${{ inputs.versionName }}
        run: |
          APP_VERSION="$OVERRIDE"
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION=$(sed -n 's/^const APP_VERSION = "\(.*\)";$/\1/p' src/lib/app-version.ts)
          fi
          if ! printf '%s' "$APP_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Could not resolve a valid version. Got '$APP_VERSION'. Check APP_VERSION in src/lib/app-version.ts."
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Building GeoField $APP_VERSION (versionCode ${{ github.run_number }})"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        # Fall back to a non-frozen install if the lockfile lags package.json,
        # rather than failing the whole APK build on a lockfile mismatch.
        run: bun install --frozen-lockfile || bun install

      - name: Build web assets (SPA mode, no nitro)
        env:
          CAPACITOR_BUILD: '1'
        run: bun run build

      - name: Create static entry point
        run: |
          test -f dist/client/_shell.html || { echo "prerendered shell missing"; exit 1; }
          cp dist/client/_shell.html dist/client/index.html
          ls -la dist/client/
          du -sh dist/client

      - name: Generate Android project
        run: ./node_modules/.bin/cap add android

      - name: Sync web assets into Android project
        run: ./node_modules/.bin/cap sync android

      # capgo-capacitor-social-login's Google provider always pulls in
      # com.google.androidbrowserhelper:androidbrowserhelper:2.5.0, which needs
      # androidx.browser:browser:1.4.0 on the runtime classpath. Disabling the
      # unused Apple provider (capacitor.config.ts) makes the plugin's own
      # androidx.browser:browser:1.9.0 requirement compileOnly, so it never
      # reaches the runtime classpath either. Android Gradle Plugin's
      # "consistent resolution" then locks the compile classpath to whatever
      # resolved on the runtime classpath (1.4.0), which conflicts with the
      # compileOnly 1.9.0 requirement and fails the build. Forcing every
      # configuration to the same version removes the skew.
      #
      # That version must be 1.4.0, not 1.9.0: androidx.browser 1.9.0's AAR
      # metadata requires compileSdk 36 and Android Gradle Plugin 8.9.1+, and
      # this project builds against compileSdk 35 / AGP 8.7.2. 1.4.0 is proven
      # compatible here (it's what already resolved successfully on the
      # runtime classpath before this fix), and the plugin's own Android
      # source only calls long-stable androidx.browser.customtabs APIs
      # (CustomTabsClient/Session/ServiceConnection/Callback/Intent.Builder,
      # TrustedWebActivityIntentBuilder) that have existed since androidx.
      # browser's early releases, so nothing in this plugin needs 1.9.0
      # specifically. The unused Apple/Twitter/Facebook providers stay
      # disabled in capacitor.config.ts; only the forced version changed.
      - name: Force a single androidx.browser version (Gradle consistent-resolution fix)
        run: |
          test -f android/build.gradle || { echo "::error::android/build.gradle not found"; exit 1; }
          cat >> android/build.gradle <<'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'androidx.browser:browser:1.4.0'
                  }
              }
          }
          EOF

      # The web app's LOCATE flow calls a native "EnableLocation" plugin that
      # shows Google Play Services' one-tap "turn on location" dialog over the
      # app (SettingsClient + ResolvableApiException). Capacitor has no such
      # API, and android/ is regenerated every build, so the plugin is
      # injected here.
      - name: Inject EnableLocation native plugin
        run: |
          python3 - <<'PY'
          import pathlib, sys

          pkg_dir = pathlib.Path("android/app/src/main/java/com/eondesigns/geofield")
          if not pkg_dir.is_dir():
              sys.exit(f"::error::{pkg_dir} not found; has the package name changed?")

          plugin = pkg_dir / "EnableLocationPlugin.java"
          plugin.write_text('''package com.eondesigns.geofield;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.google.android.gms.common.api.ResolvableApiException;
          import com.google.android.gms.location.LocationRequest;
          import com.google.android.gms.location.LocationServices;
          import com.google.android.gms.location.LocationSettingsRequest;
          import com.google.android.gms.location.Priority;
          import com.google.android.gms.location.SettingsClient;

          @CapacitorPlugin(name = "EnableLocation")
          public class EnableLocationPlugin extends Plugin {

            @PluginMethod
            public void request(PluginCall call) {
              try {
                LocationRequest lr = new LocationRequest.Builder(Priority.PRIORITY_HIGH_ACCURACY, 10000).build();
                LocationSettingsRequest req = new LocationSettingsRequest.Builder()
                    .addLocationRequest(lr)
                    .setAlwaysShow(true)
                    .build();
                SettingsClient client = LocationServices.getSettingsClient(getActivity());
                client.checkLocationSettings(req)
                    .addOnSuccessListener(r -> {
                      JSObject o = new JSObject();
                      o.put("status", "enabled");
                      call.resolve(o);
                    })
                    .addOnFailureListener(e -> {
                      if (e instanceof ResolvableApiException) {
                        try {
                          ((ResolvableApiException) e).startResolutionForResult(getActivity(), 42001);
                          JSObject o = new JSObject();
                          o.put("status", "prompted");
                          call.resolve(o);
                        } catch (Exception ex) {
                          JSObject o = new JSObject();
                          o.put("status", "unavailable");
                          call.resolve(o);
                        }
                      } else {
                        JSObject o = new JSObject();
                        o.put("status", "unavailable");
                        call.resolve(o);
                      }
                    });
              } catch (Exception e) {
                JSObject o = new JSObject();
                o.put("status", "unavailable");
                call.resolve(o);
              }
            }
          }
          '''.replace("\n          ", "\n"))

          main = pkg_dir / "MainActivity.java"
          src = main.read_text()
          marker = "public class MainActivity extends BridgeActivity {}"
          if marker not in src:
              sys.exit("::error::MainActivity.java does not match the expected Capacitor template; refusing to patch blind.")
          src = src.replace(
              "import com.getcapacitor.BridgeActivity;",
              "import android.content.Intent;\n"
              "import android.os.Bundle;\n"
              "import com.getcapacitor.BridgeActivity;\n"
              "import com.getcapacitor.PluginHandle;\n"
              "import ee.forgr.capacitor.social.login.ModifiedMainActivityForSocialLoginPlugin;\n"
              "import ee.forgr.capacitor.social.login.SocialLoginPlugin;",
          )
          # @capgo/capacitor-social-login's Google provider requests Drive
          # scopes via a raw activity.startIntentSenderForResult call, which
          # bypasses Capacitor's automatic result-forwarding (the plugin only
          # auto-forwards Facebook/Twitter results). Without this, login()
          # rejects with "You CANNOT use scopes without modifying the main
          # activity" the moment custom scopes are requested. Implementing the
          # plugin's marker interface and forwarding onActivityResult is the
          # documented fix (ee.forgr...GoogleProvider.java's own instanceof
          # check + SocialLoginPlugin.handleGoogleLoginIntent).
          src = src.replace(
              marker,
              "public class MainActivity extends BridgeActivity implements ModifiedMainActivityForSocialLoginPlugin {\n"
              "    @Override\n"
              "    public void onCreate(Bundle savedInstanceState) {\n"
              "        registerPlugin(EnableLocationPlugin.class);\n"
              "        super.onCreate(savedInstanceState);\n"
              "    }\n"
              "\n"
              "    @Override\n"
              "    public void onActivityResult(int requestCode, int resultCode, Intent data) {\n"
              "        super.onActivityResult(requestCode, resultCode, data);\n"
              "        PluginHandle handle = getBridge().getPlugin(\"SocialLogin\");\n"
              "        if (handle != null && handle.getInstance() instanceof SocialLoginPlugin) {\n"
              "            ((SocialLoginPlugin) handle.getInstance()).handleGoogleLoginIntent(requestCode, data);\n"
              "        }\n"
              "    }\n"
              "\n"
              "    @Override\n"
              "    public void IHaveModifiedTheMainActivityForTheUseWithSocialLoginPlugin() {}\n"
              "}",
          )
          main.write_text(src)

          gradle = pathlib.Path("android/app/build.gradle")
          g = gradle.read_text()
          dep = 'implementation "com.google.android.gms:play-services-location:21.3.0"'
          if dep not in g:
              g = g.replace("dependencies {", "dependencies {\n    " + dep, 1)
              gradle.write_text(g)

          print("EnableLocation plugin injected, MainActivity patched, play-services-location added.")
          PY



      # @capacitor/assets insets the foreground 16.7% on every side. Source art
      # must therefore be tight to the glyph, or the padding compounds and the
      # pin shrinks. Generated here from logo.ts so the mark has exactly one
      # source of truth and no PNG has to be committed.
      - name: Render icon sources from the GeoField mark
        run: |
          # Ubuntu 24.04 runners mark system Python externally-managed (PEP 668).
          python3 -m pip install --quiet --disable-pip-version-check --break-system-packages pillow \
            || python3 -m pip install --quiet --disable-pip-version-check pillow \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil; }
          python3 -c "import PIL; print('pillow', PIL.__version__)"
          mkdir -p assets
          python3 - <<'PY'
          import base64, io, pathlib, re
          from PIL import Image

          src = pathlib.Path("src/lib/logo.ts").read_text()
          m = re.search(r"data:image/png;base64,([A-Za-z0-9+/=]+)", src)
          if not m:
              raise SystemExit("GEOFIELD_MARK base64 not found in src/lib/logo.ts")
          mark = Image.open(io.BytesIO(base64.b64decode(m.group(1)))).convert("RGBA")

          CANVAS = 1024
          # White launcher background. The mark's crescent and waves are
          # transparent cutouts, so whatever sits behind shows through them;
          # white here turns the whole square and those cutouts white, leaving
          # only the orange pin.
          ICON_BG = (0xFF, 0xFF, 0xFF, 255)

          def canvas_with_mark(height_fraction, background):
              h = round(CANVAS * height_fraction)
              w = round(h * mark.width / mark.height)
              glyph = mark.resize((w, h), Image.LANCZOS)
              out = Image.new("RGBA", (CANVAS, CANVAS), background)
              out.alpha_composite(glyph, ((CANVAS - w) // 2, (CANVAS - h) // 2))
              return out

          # Adaptive foreground. 84% survives the 16.7% inset and the circular mask.
          canvas_with_mark(0.84, (0, 0, 0, 0)).save("assets/icon-foreground.png")
          # Adaptive background. Flat white.
          Image.new("RGBA", (CANVAS, CANVAS), ICON_BG).save("assets/icon-background.png")
          # Legacy square icon. No inset is applied to this one, so it needs its
          # own margin for launchers that mask it into a circle.
          canvas_with_mark(0.62, ICON_BG).save("assets/icon.png")

          for name in ("icon-foreground.png", "icon-background.png", "icon.png"):
              im = Image.open("assets/" + name)
              print(f"{name:24} {im.size[0]}x{im.size[1]} {im.mode}")
          PY

      - name: Generate app icons and splash from the GeoField mark
        run: |
          # Icon background is white and fixed for both themes: the launcher
          # icon is brand identity on the home screen/app drawer, not in-app
          # chrome, so it doesn't follow the light/dark theme. The splash
          # background does, since it's what's on screen for the moment
          # before the WebView paints - the same "avoid a flash of the wrong
          # theme" reasoning as capacitor.config.ts's backgroundColor.
          ./node_modules/.bin/capacitor-assets generate --android \
            --iconBackgroundColor '#FFFFFF' \
            --iconBackgroundColorDark '#FFFFFF' \
            --splashBackgroundColor '#F9FAFB' \
            --splashBackgroundColorDark '#F9FAFB'
          find android/app/src/main/res -name "ic_launcher*" | head -20

      - name: Add required permissions to AndroidManifest
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          x = p.read_text()
          perms = [
            "android.permission.ACCESS_FINE_LOCATION",
            "android.permission.ACCESS_COARSE_LOCATION",
            "android.permission.RECORD_AUDIO",
            "android.permission.MODIFY_AUDIO_SETTINGS",
            "android.permission.INTERNET",
          ]
          add = "".join(
            f'    <uses-permission android:name="{n}" />\n'
            for n in perms if n not in x
          )
          if add:
            x = x.replace("</manifest>", add + "</manifest>")
            p.write_text(x)
          print(x)
          PY

      - name: Paint the system bars with the light shell colour
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          p = pathlib.Path("android/app/src/main/res/values/styles.xml")
          x = p.read_text()
          m = re.search(r'<style name="AppTheme\.NoActionBar"[^>]*>', x)
          if not m:
              sys.exit("AppTheme.NoActionBar not found in styles.xml")
          if "android:windowBackground" not in x:
              # Matches src/styles.css's --background (#F9FAFB). windowLightStatusBar/
              # windowLightNavigationBar true means the bars are light, so their
              # icons render dark - the Android convention is backwards-sounding
              # but this is the correct pairing for a light bar.
              items = (
                  '\n        <item name="android:windowBackground">#FFF9FAFB</item>'
                  '\n        <item name="android:statusBarColor">#FFF9FAFB</item>'
                  '\n        <item name="android:navigationBarColor">#FFF9FAFB</item>'
                  '\n        <item name="android:windowLightStatusBar">true</item>'
                  '\n        <item name="android:windowLightNavigationBar">true</item>'
              )
              x = x[:m.end()] + items + x[m.end():]
              p.write_text(x)
          print(x)
          PY

      - name: Set versionCode and versionName
        env:
          VN: ${{ env.APP_VERSION }}
          VC: ${{ github.run_number }}
        run: |
          f=android/app/build.gradle
          sed -i "s/versionCode .*/versionCode $VC/" "$f"
          sed -i "s/versionName \".*\"/versionName \"$VN\"/" "$f"
          grep -E "versionCode|versionName|applicationId" "$f"

      - name: Restore keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/geofield.keystore"
          ls -l "$RUNNER_TEMP/geofield.keystore"

      - name: Build signed release APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/geofield.keystore" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KS_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Verify the APK is signed by our key
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK: $APK"
          ls -lh "$APK"
          SIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
          "$SIGNER" verify --print-certs "$APK"
          cp "$APK" "GeoField-${{ env.APP_VERSION }}.apk"

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/geofield.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: GeoField-apk
          path: GeoField-*.apk
          retention-days: 7

      # Skipped for test builds: a test APK must never overwrite the stable
      # release of record.
      - name: Publish APK to a GitHub Release
        if: ${{ github.event.inputs.test_build != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: GeoField v${{ env.APP_VERSION }}
          files: GeoField-${{ env.APP_VERSION }}.apk
          fail_on_unmatched_files: true

      # geofield-instrument is private, so GitHub Release assets require a
      # signed-in, authorized GitHub account to download - no good for
      # students installing the app. geofield-assets is a separate public
      # repo (Pages already serves ghana.pmtiles from its main branch root),
      # so publishing the APK there too gives a plain HTTPS download link
      # with no GitHub account needed. Uses the Contents API (not a git
      # clone) so this never has to pull the 92MB pmtiles blob just to write
      # two small files. continue-on-error: the signed APK and GitHub
      # Release above are the release of record; a hiccup publishing the
      # mirror (token not set up yet, transient API error) shouldn't mark
      # the whole build failed.
      - name: Publish APK and version.json to geofield-assets (Pages)
        continue-on-error: true
        env:
          ASSETS_TOKEN: ${{ secrets.ASSETS_DEPLOY_TOKEN }}
          APP_VERSION: ${{ env.APP_VERSION }}
          TEST_BUILD: ${{ github.event.inputs.test_build }}
        run: |
          if [ -z "$ASSETS_TOKEN" ]; then
            echo "::warning::ASSETS_DEPLOY_TOKEN is not set; skipping publish to geofield-assets."
            exit 0
          fi
          # Test build: publish ONLY geofield-test.apk. The public geofield.apk,
          # version.json, and the GitHub Release are left untouched, so students
          # on the current version see nothing change and get no update banner.
          if [ "$TEST_BUILD" = "true" ]; then
            cp "GeoField-${APP_VERSION}.apk" geofield-test.apk
          else
            cp "GeoField-${APP_VERSION}.apk" geofield.apk
          fi
          python3 - <<'PY'
          import base64, json, os, urllib.error, urllib.request

          TOKEN = os.environ["ASSETS_TOKEN"]
          VERSION = os.environ["APP_VERSION"]
          TEST = os.environ.get("TEST_BUILD") == "true"
          REPO = "Eddywin-bit/geofield-assets"
          APK_URL = "https://eddywin-bit.github.io/geofield-assets/geofield.apk"

          def api(method, path, body=None):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{REPO}/{path}",
                  data=json.dumps(body).encode() if body is not None else None,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.loads(resp.read() or b"{}")
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      return None
                  raise

          def put_file(path, data, message):
              # Overwriting an existing file requires its current blob sha;
              # omit it entirely to create the file the first time.
              existing = api("GET", f"contents/{path}?ref=main")
              body = {
                  "message": message,
                  "content": base64.b64encode(data).decode(),
                  "branch": "main",
              }
              if existing:
                  body["sha"] = existing["sha"]
              api("PUT", f"contents/{path}", body)
              print(f"Published {path}")

          if TEST:
              # Isolated test channel only: no version.json, no geofield.apk.
              with open("geofield-test.apk", "rb") as f:
                  put_file("geofield-test.apk", f.read(), f"Publish GeoField {VERSION} TEST APK")
          else:
              with open("geofield.apk", "rb") as f:
                  put_file("geofield.apk", f.read(), f"Publish GeoField {VERSION} APK")
              version_json = json.dumps({"version": VERSION, "url": APK_URL}, indent=2).encode() + b"\n"
              put_file("version.json", version_json, f"Update version.json for GeoField {VERSION}")
          PY
