name: Generate keystore (run once)
on:
  workflow_dispatch: {}
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create the keystore
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -genkeypair -v \
            -keystore geofield.keystore \
            -alias "$KS_ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storetype PKCS12 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=Edwin Gyasi Owusu, OU=GeoField, O=Eon Designs, L=Kumasi, ST=Ashanti, C=GH"
          base64 -w0 geofield.keystore > keystore.b64
          echo "--- verification ---"
          keytool -list -v -keystore geofield.keystore -storepass "$KS_PASS" | head -15
          wc -c geofield.keystore keystore.b64

      - uses: actions/upload-artifact@v4
        with:
          name: geofield-keystore
          path: |
            geofield.keystore
            keystore.b64
          retention-days: 1
